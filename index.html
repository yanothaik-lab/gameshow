<style>
/* Concept: a TV game-show stage for the classroom. Midnight navy, gold highlight, one saturated colour per team. Built for a projector and the teacher's phone. */
:root{
  --bg:#0c1230;--bg2:#141c48;--card:#1b2559;--card2:#222e6b;--ink:#f4f6ff;--mute:#a7b1e0;--gold:#ffc83d;--line:#35417f;
  --ok:#2fd27f;--no:#ff5470;--blue:#4f8cff;
  --t1:#ff5470;--t2:#4f8cff;--t3:#2fd27f;--t4:#b66bff;--t5:#ff9f2e;--t6:#22d3e0;
  --f-d:'Kanit','Sarabun',sans-serif;--f-b:'Sarabun','Kanit',system-ui,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#24307a 0,var(--bg) 60%) fixed;color:var(--ink);font-family:var(--f-b);font-size:17px;
 padding:12px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-d);font-weight:800;font-size:clamp(22px,3.6vw,34px);margin:0;line-height:1.2}
.sub{color:var(--mute);margin:2px 0 0;font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;min-width:44px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-family:var(--f-d);font-weight:700}
.tab[aria-selected=true]{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.tab[disabled]{opacity:.35;cursor:default}
.btn{border:2px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 16px;font-family:var(--f-d);font-weight:700}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#06221a;border-color:var(--ok)}
.btn.no{background:var(--no);color:#fff;border-color:var(--no)}
.btn.big{padding:14px 24px;font-size:20px}
.btn.sm{padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:default}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1 1 150px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:8px 12px;text-align:left}
.step small{display:block;color:var(--mute);font-size:13px}
.step b{font-family:var(--f-d);font-size:16px}
.step[aria-current=step]{border-color:var(--gold);background:#2a2f6a}
.step.done{opacity:.7}
.stage{background:linear-gradient(180deg,var(--card),var(--bg2));border:2px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:16px;min-height:360px}
.stage h2{font-family:var(--f-d);font-weight:800;font-size:clamp(26px,4.6vw,48px);margin:0;line-height:1.2}
.kick{color:var(--gold);font-family:var(--f-d);font-weight:700;letter-spacing:.02em}
.big{font-size:inherit}
.q{font-family:var(--f-d);font-weight:700;font-size:clamp(24px,4.6vw,46px);line-height:1.3;margin:0}
ul.pts{margin:0;padding-left:1.2em;font-size:clamp(18px,2.6vw,28px);line-height:1.5;display:flex;flex-direction:column;gap:6px}
.ask{border-left:6px solid var(--gold);background:#ffffff12;border-radius:10px;padding:10px 14px;font-weight:700;font-size:clamp(17px,2.4vw,26px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{border:2px solid var(--line);background:var(--card2);border-radius:16px;padding:18px;font-family:var(--f-d);font-weight:700;font-size:clamp(18px,2.6vw,28px);text-align:left}
.say{background:#ffffff10;border-radius:12px;padding:10px 14px;color:var(--mute);font-size:15px}
.say b{color:var(--gold)}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{border-radius:12px;padding:10px 16px;text-align:center;color:#101010;font-family:var(--f-d);font-weight:700;font-size:clamp(16px,2.4vw,26px)}
.pyr small{display:block;font-family:var(--f-b);font-weight:600;font-size:.62em}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.swap .p{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:center;font-family:var(--f-d);font-weight:800;font-size:clamp(20px,3vw,32px)}
.swap .ar{display:flex;flex-direction:column;gap:8px;font-size:clamp(14px,2vw,22px);color:var(--gold);font-weight:700;text-align:center}
@media(max-width:700px){.swap{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{border-radius:16px;padding:14px;color:#101010}
.col b{font-family:var(--f-d);font-size:clamp(20px,2.8vw,30px);display:block}
.col ul{margin:6px 0 0;padding-left:1.1em;font-size:clamp(15px,2vw,22px);font-weight:600}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tl div{border-top:5px solid var(--gold);padding-top:6px;font-weight:700}
.tl b{font-family:var(--f-d);font-size:clamp(20px,3vw,32px);color:var(--gold);display:block}
.chain{display:flex;flex-direction:column;gap:6px}
.chain div{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:clamp(16px,2.3vw,24px)}
.chain div:not(:last-child)::after{content:'↓';display:block;text-align:center;color:var(--gold);font-size:1.1em;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto}
.hot{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pick{font-family:var(--f-d);font-weight:800;font-size:clamp(36px,8vw,84px);color:var(--gold);min-height:1.3em}
.ans{border:3px dashed var(--gold);border-radius:14px;padding:12px 16px;font-size:clamp(18px,2.8vw,30px);font-weight:700;background:#ffc83d14}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:#3b57d9;border-radius:12px;padding:10px 4px;text-align:center;font-family:var(--f-d);font-weight:800;font-size:clamp(14px,2.4vw,26px)}
.tile{background:var(--card2);border:2px solid var(--gold);border-radius:12px;min-height:clamp(64px,12vw,110px);font-family:var(--f-d);font-weight:800;font-size:clamp(28px,5vw,54px);color:var(--gold)}
.tile.used{opacity:.18;border-color:var(--line);cursor:default}
.turnbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-d);font-weight:700;font-size:clamp(16px,2.4vw,24px)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 14px;color:#10131f;font-family:var(--f-d);font-weight:800}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0a0f28f2;border-top:2px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;overflow-x:auto;justify-content:safe center}
.tm{flex:1 0 118px;max-width:200px;border-radius:14px;border:3px solid var(--c);background:var(--card);padding:6px 8px;text-align:center}
.tm.turn{background:color-mix(in srgb,var(--c) 30%,var(--card));box-shadow:0 0 0 3px #fff3}
.tm b{display:block;font-family:var(--f-d);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .s{font-family:var(--f-d);font-weight:800;font-size:28px;line-height:1.1;color:var(--c)}
.tm .pm{display:flex;gap:4px;justify-content:center;margin-top:2px}
.tm .pm button{width:38px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:800}
.modal{position:fixed;inset:0;z-index:30;background:#050818e6;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none!important}
.mc{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--card);border:3px solid var(--gold);border-radius:22px;padding:clamp(16px,3vw,30px);display:flex;flex-direction:column;gap:14px}
.mtimer{height:10px;border-radius:99px;background:#ffffff22;overflow:hidden}
.mtimer i{display:block;height:100%;background:var(--gold);transform-origin:left}
.awards{display:flex;flex-wrap:wrap;gap:8px}
.awards button{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));border-radius:12px;padding:8px 12px;font-family:var(--f-d);font-weight:800;min-width:96px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-family:var(--f-d);font-weight:700}
.bar i{display:block;height:30px;border-radius:8px;background:var(--c);transition:width .8s}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card2{background:#ffffff0d;border:2px solid var(--line);border-radius:16px;padding:14px}
.card2 h3{margin:0 0 8px;font-family:var(--f-d)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;color:var(--mute)}
input[type=text],input[type=number],textarea{background:#0b1030;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
textarea{width:100%;min-height:200px;line-height:1.5}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.hint{color:var(--mute);font-size:14px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.gtabs{display:flex;gap:8px;flex-wrap:wrap}
.gtab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-family:var(--f-d);font-weight:700}
.gtab[aria-selected=true]{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.rulebox{background:#ffffff10;border-radius:12px;padding:10px 14px;color:var(--mute);font-size:15px}
.rulebox b{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc1{min-height:clamp(70px,13vw,120px);border-radius:12px;border:2px solid var(--line);background:linear-gradient(135deg,#3b57d9,#2a3a9a);font-family:var(--f-d);font-weight:800;font-size:clamp(14px,2.2vw,22px);padding:6px;display:flex;align-items:center;justify-content:center;text-align:center}
.mc1.open{background:#fff;color:#111;border-color:var(--gold)}
.mc1.done{background:#2fd27f33;color:var(--ink);border-color:var(--ok);opacity:.55}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:clamp(17px,2.4vw,26px)}
.clue.hid{opacity:.25}
.ord{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ord div{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:clamp(16px,2.3vw,24px)}
.ord b{color:var(--gold);font-family:var(--f-d);margin-right:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));border-radius:12px;padding:8px 12px;font-family:var(--f-d);font-weight:800;min-width:92px}
.chipb.on{background:var(--c);color:#10131f}
.chipb[disabled]{opacity:.3}
.wheel{position:relative;width:min(330px,80vw);aspect-ratio:1;margin:0 auto}
.wheel .disc{position:absolute;inset:0;border-radius:50%;border:6px solid var(--gold);transition:transform 3.2s cubic-bezier(.12,.7,.1,1)}
.wheel .lb{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .lb span{position:absolute;left:-46px;top:-118px;width:92px;text-align:center;color:#10131f;font-family:var(--f-d);font-weight:800;font-size:15px;line-height:1.1}
.wheel .ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #fff;z-index:2}
.rt{width:100%;border-collapse:collapse}
.rt th,.rt td{padding:6px;border-bottom:1px solid var(--line);text-align:center;font-family:var(--f-d)}
.rt td:first-child{text-align:left}
.seg{display:inline-flex;gap:3px}
.seg button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--card2);font-weight:800}
.seg button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.optr{display:flex;gap:6px;flex-wrap:wrap}
.optr button{border:2px solid var(--line);background:var(--card2);border-radius:10px;padding:5px 10px;font-weight:800}
.optr button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.res{border-radius:12px;padding:10px 14px;background:#ffffff10;border-left:6px solid var(--c,var(--gold));margin:6px 0}
.tbig{font-family:var(--f-d);font-weight:800;font-size:clamp(40px,9vw,90px);color:var(--gold);text-align:center}
.mo{display:flex;flex-direction:column;gap:8px}
.mo .o{border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:clamp(17px,2.4vw,26px);background:var(--card2)}
.mo .o.right{border-color:var(--ok);background:#2fd27f26}
.mo .o.gone{opacity:.25;text-decoration:line-through}
.clsel{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.clsel select{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:#1b2150;color:#fff;min-height:40px}

PERIODS[11]={no:11,m:[5,14,6,20,5],title:'โต้แย้งสลับฝั่ง: อิสราเอล–ปาเลสไตน์',sub:'ฟังให้เข้าใจก่อนตัดสิน + รู้เท่าทันสื่อ',
 goal:'อธิบายความเป็นมาและประเด็นหลักของความขัดแย้ง ฝึกฟังมุมมองที่ต่างกัน และแยกข้อเท็จจริงกับความเห็น',
 hook:{q:'ก่อนเรียนเรื่องที่คนในโลกเห็นต่างกันมาก เราควรมีกติกาอะไรร่วมกัน?',opts:['ใครเสียงดังกว่าชนะ','แยกข้อเท็จจริงกับความเห็น','พูดเฉพาะฝั่งที่เห็นด้วย','ไม่พูดเรื่องนี้เลย'],say:'เปิดคาบด้วยกติกา: ฟังจนจบ ไม่ใช้คำดูหมิ่น ไม่เหมารวมกลุ่มคน และตรวจแหล่งข้อมูล ครูตรวจข่าวล่าสุดและใช้แหล่งที่หลากหลายก่อนสอน'},
 slides:[
  {k:'กติกาห้องเรียน',h:'ฟังก่อนตัดสิน',cols:[['ข้อเท็จจริง','#2b6cdf',['ตรวจสอบได้ มีวันที่ ตัวเลข แหล่งที่มา']],['ความเห็น','#f08a1c',['การตัดสินคุณค่า ความรู้สึก']],['ภาษา','#1f9d55',['ไม่ดูหมิ่น ไม่เหมารวมกลุ่มคน','พลเรือนทุกฝ่ายสมควรได้รับการคุ้มครอง']]],ask:'ทำไมเรื่องนี้จึงต้องใช้ภาษาอย่างระมัดระวัง?'},
  {k:'ความเป็นมา',h:'ก่อน ค.ศ. 1948',pts:['พื้นที่ปาเลสไตน์เคยอยู่ใต้จักรวรรดิออตโตมัน หลังสงครามโลกครั้งที่ 1 อยู่ใต้การปกครองของอังกฤษ','ชาวอาหรับปาเลสไตน์อาศัยอยู่ในพื้นที่มานาน ขณะที่ชาวยิวอพยพเข้ามามากขึ้นตั้งแต่ปลายศตวรรษที่ 19','คำประกาศบาลโฟร์ ค.ศ. 1917 ของอังกฤษสนับสนุน "บ้านแห่งชาติ" ของชาวยิว','หลังการสังหารหมู่ชาวยิวในสงครามโลกครั้งที่ 2 การอพยพเพิ่มขึ้นอีก'],ask:'สัญญาของมหาอำนาจให้หลายฝ่ายพร้อมกัน ก่อปัญหาอย่างไร?'},
  {k:'จุดเปลี่ยน',h:'ค.ศ. 1947–1948',chain:['ค.ศ. 1947 สหประชาชาติเสนอแผนแบ่งดินแดนเป็นรัฐยิวและรัฐอาหรับ (มติที่ 181)','ผู้นำชุมชนยิวส่วนใหญ่รับแผน ผู้นำอาหรับปฏิเสธ','14 พ.ค. 1948 อิสราเอลประกาศก่อตั้งรัฐ เกิดสงครามอาหรับ–อิสราเอล','ชาวปาเลสไตน์ราว 700,000 คนอพยพหรือถูกบังคับให้ออก ซึ่งชาวปาเลสไตน์เรียกว่า "นักบา" (หายนะ)'],ask:'เหตุการณ์เดียวกันถูกจดจำต่างกันอย่างไรในแต่ละฝ่าย?'},
  {k:'ต่อมา',h:'ค.ศ. 1967 ถึงปัจจุบัน',pts:['ค.ศ. 1967 สงครามหกวัน อิสราเอลยึดเวสต์แบงก์ ฉนวนกาซา เยรูซาเลมตะวันออก คาบสมุทรไซนาย และที่ราบสูงโกลัน','ค.ศ. 1993 ข้อตกลงออสโล: อิสราเอลและองค์การปลดปล่อยปาเลสไตน์รับรองกัน เกิดทางการปาเลสไตน์','แต่ปัญหาสำคัญยังไม่ยุติ และสถานการณ์ปัจจุบันเปลี่ยนเร็ว'],ask:'ทำไมข้อตกลงสันติภาพจึงทำได้ยาก?'},
  {k:'ประเด็นหลัก',h:'เรื่องที่ยังเห็นต่างกัน',cols:[['ดินแดนและพรมแดน','#2b6cdf',['เส้นแบ่งและสถานะดินแดนที่ถูกยึดหลัง 1967']],['เยรูซาเลม','#8a4fd6',['เมืองศักดิ์สิทธิ์ของยิว คริสต์ และมุสลิม']],['ผู้ลี้ภัย','#d6334a',['สิทธิกลับคืนถิ่นของชาวปาเลสไตน์']],['ความมั่นคงและนิคม','#f08a1c',['ความปลอดภัยของประชาชนทุกฝ่าย การตั้งนิคมในเวสต์แบงก์']]],ask:'ถ้าคุณเป็นคนกลาง จะเริ่มคุยประเด็นไหนก่อน?'},
  {k:'รู้เท่าทันสื่อ',h:'อ่านข่าวสงครามอย่างระวัง',pts:['ดูคำที่ใช้: คำบางคำแฝงมุมมองอยู่','ตรวจภาพและวันที่ ภาพเก่ามักถูกนำมาใช้ซ้ำ','เทียบอย่างน้อย 2–3 แหล่งจากหลายมุมมอง','ตัวเลขผู้เสียชีวิตต้องดูผู้อ้างและเวลา','เห็นใจผู้ได้รับผลกระทบได้ โดยไม่ต้องเกลียดคนทั้งกลุ่ม'],ask:'ข่าวที่ทำให้เรารู้สึกโกรธมาก ควรตรวจอะไรก่อนแชร์?'}],

  {type:'quick',name:'ข้อเท็จจริงหรือความเห็น',opts:['ข้อเท็จจริง','ความเห็นหรือเหมารวม'],rule:'ครูอ่านข้อความ ทุกกลุ่มยืนซ้ายหรือขวาพร้อมกัน ทีมที่ถูกได้ 1 คะแนน',items:[

PERIODS[12]={no:12,m:[5,14,6,20,5],title:'ประชุมสุดยอดผู้นำโลกจำลอง',sub:'โลกร้อน พลังงาน-สิ่งแวดล้อม วิกฤตเศรษฐกิจ',

 hook:{q:'ถ้าทุกประเทศอยากให้ประเทศอื่นลดการปล่อยคาร์บอนก่อน จะเกิดอะไรขึ้น?',opts:['ปัญหาแก้ได้เร็ว','ไม่มีใครลง ปัญหาเรื้อรัง','ทุกประเทศได้ประโยชน์เท่ากัน','เทคโนโลยีแก้ให้เอง'],say:'เล่าให้ฟังเรื่อง "ปัญหาการใช้ของส่วนรวม" และถามว่า "ใครควรรับผิดชอบมากกว่ากัน ประเทศที่ปล่อยมากหรือประเทศที่เสี่ยงที่สุด"'},
 slides:[

  const stb=$('#st');if(stb)stb.onclick=()=>{st.run=true;st.t=secs;st.got=0;reEng();clearInterval(tmr);st.pz=false;tmr=setInterval(()=>{if(st.pz)return;st.t--;const e=$('#tt');if(e)e.textContent=st.t;if(st.t<=5&&st.t>0)snd.tick();if(st.t<=0){clearInterval(tmr);snd.bad();st.run=false;st.turn=(st.turn+1)%NT();reEng();renderDock()}},1000)};
  const tbz=$('#tbz');if(tbz)tbz.onclick=()=>{st.pz=!st.pz;tbz.textContent=st.pz?'▶ เดินต่อ':'⏸ หยุดเวลา'};
  const gt=$('#gt');if(gt)gt.onclick=()=>{addT(st.turn,1);st.got=(st.got||0)+1;st.i++;snd.ok();reEng()};
  const sk=$('#sk');if(sk)sk.onclick=()=>{st.i++;snd.bad();reEng()}}};
/* decide: scenario simulation */
ENG.decide={render(g,st){st.r=st.r||0;st.ch=st.ch||NM().map(()=>null);st.ap=st.ap||{};const rd=g.rounds[st.r%g.rounds.length];
  return `<div class="turnbar"><span>สถานการณ์ ${st.r%g.rounds.length+1}/${g.rounds.length}</span></div><p class="q" style="font-size:clamp(20px,3.2vw,34px)">${esc(rd.s)}</p>
  <div class="mo">${rd.o.map((o,i)=>`<div class="o">${'ABC'[i]}. ${esc(o.t)}</div>`).join('')}</div>
  <p class="hint">แต่ละทีมปรึกษา 1 นาที แล้วครูแตะตัวเลือกที่ทีมนั้นเลือก</p>
  ${NM().map((n,i)=>`<div class="row"><span class="chip" style="background:${TCH[i]};min-width:104px">${esc(n)}</span><div class="optr">${rd.o.map((o,j)=>`<button data-tc="${i}" data-o="${j}" class="${st.ch[i]===j?'on':''}" ${st.rev?'disabled':''}>${'ABC'[j]}</button>`).join('')}</div></div>`).join('')}
  ${st.rev?rd.o.map((o,j)=>`<div class="res"><b>${'ABC'[j]} • ${o.p} คะแนน</b> ${esc(o.r)}<br><small>ทีมที่เลือก: ${NM().map((n,i)=>st.ch[i]===j?n:'').filter(Boolean).map(esc).join(', ')||'-'}</small></div>`).join(''):''}
  <div class="row"><button class="btn gold big" id="rv" ${st.rev?'disabled':''}>เปิดผลที่ตามมา และให้คะแนน</button><button class="btn" id="nx">สถานการณ์ต่อไป</button></div>`},
 wire(g,st){const rd=g.rounds[st.r%g.rounds.length];
  document.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{st.ch[+b.dataset.tc]=+b.dataset.o;reEng()});
  $('#rv').onclick=()=>{st.rev=true;NM().forEach((n,i)=>{if(st.ch[i]!=null&&!st.ap[st.r+':'+i]){st.ap[st.r+':'+i]=1;addT(i,rd.o[st.ch[i]].p)}});snd.ok();reEng()};
  $('#nx').onclick=()=>{st.r++;st.rev=false;st.ch=NM().map(()=>null);reEng()}}};
function wireGames(){const g=P().games[gi];ENG[g.type].wire(g,gst());document.querySelectorAll('.gtab[data-g]').forEach(b=>b.onclick=()=>{gi=+b.dataset.g;render()})}
/* ---- phase 5 ---- */
function totals(){return NM().map((n,i)=>({n,i,p:TS()[i],all:Object.values(S.sc).reduce((a,x)=>a+((x[S.mode==='solo'?'s':'t']||[])[i]||0),0)}))}
function viewWrap(){const T=totals().sort((a,b)=>b.p-a.p),mx=Math.max(1,...T.map(x=>x.p));
  const ind=Object.entries(sc().i).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<div class="stage"><div class="kick">สรุปคาบ ${cp}</div><h2>ผลคะแนนวันนี้</h2>
  <div class="two"><div class="card2"><h3>กลุ่ม (คาบนี้ / สะสม)</h3><div class="bars">${T.map((x,r)=>`<div class="bar" style="--c:${TCH[x.i]}"><span>${r+1}. ${esc(x.n)}</span><span><i style="width:${Math.max(3,x.p/mx*100)}%"></i></span><span>${x.p} / ${x.all}</span></div>`).join('')}</div></div>
  <div class="card2"><h3>ดาวเด่นรายบุคคล</h3>${ind.length?`<ol style="margin:0;padding-left:1.3em;font-size:20px;font-weight:700">${ind.map(([n,v])=>`<li>${esc(n)} — ${v} คะแนน</li>`).join('')}</ol>`:'<p class="hint">ยังไม่มีคะแนนรายบุคคล (เล่นกิจกรรมเดี่ยวเพื่อสะสม)</p>'}</div></div>
  <div class="card2"><h3>บัตรออกจากห้อง (ทำใน Google Classroom ใบงานเดี่ยวคาบ ${cp})</h3><ol style="margin:0;padding-left:1.3em;font-size:19px;line-height:1.6">${P().exit.map(e=>`<li>${esc(e)}</li>`).join('')}</ol></div>
  <div class="row"><button class="btn gold big" id="win">ประกาศผู้ชนะ</button><button class="btn big" id="copy">คัดลอกผลคะแนน</button><button class="btn" id="rst">ล้างคะแนนคาบนี้</button></div><p class="hint" id="cmsg"></p></div>`}
function summaryData(){
  const per=Object.keys(PERIODS).map(Number);
  const rows=per.map(p=>({p,t:S.sc[p]?S.sc[p].t.slice(0,S.n):S.teams.slice(0,S.n).map(()=>0)}));
  const tot=S.teams.slice(0,S.n).map((_,i)=>rows.reduce((a,r)=>a+(r.t[i]||0),0));
  const ind={};Object.values(S.sc).forEach(x=>Object.entries(x.i||{}).forEach(([n,v])=>ind[n]=(ind[n]||0)+v));
  return {rows,tot,ind:Object.entries(ind).sort((a,b)=>b[1]-a[1])}}
function openSummary(){const D=summaryData();
  showM(`<h2 style="margin:0;font-family:var(--f-d)">สรุปคะแนนห้อง ${CUR}</h2>
  <div class="card2" style="overflow:auto"><h3>คะแนนกลุ่มรายคาบ</h3><table class="sumt"><thead><tr><th>คาบ</th>${S.teams.slice(0,S.n).map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${D.rows.map(r=>`<tr><td>${r.p}</td>${r.t.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}<tr class="tt"><td>รวม</td>${D.tot.map(v=>`<td>${v}</td>`).join('')}</tr></tbody></table></div>
  <div class="card2"><h3>คะแนนรายบุคคลจากเกมเดี่ยว (สะสมทุกคาบ)</h3>${D.ind.length?`<ol style="margin:0;padding-left:1.3em;font-size:18px;line-height:1.6">${D.ind.map(([n,v])=>`<li>${esc(n)} — ${v}</li>`).join('')}</ol>`:'<p class="hint">ยังไม่มีคะแนนรายบุคคล</p>'}</div>
  <div class="row"><button class="btn gold big" id="scp">คัดลอก (วางใน Google Sheets ได้)</button><button class="btn big" id="scl">ปิด</button></div><p class="hint" id="smsg"></p>`);
  $('#scl').onclick=()=>closeM();
  $('#scp').onclick=()=>{const L=['ห้อง '+CUR,['คาบ'].concat(S.teams.slice(0,S.n)).join('\t')];D.rows.forEach(r=>L.push([r.p].concat(r.t).join('\t')));L.push(['รวม'].concat(D.tot).join('\t'));L.push('','ชื่อ\tคะแนนเดี่ยวสะสม');D.ind.forEach(([n,v])=>L.push(n+'\t'+v));
    const txt=L.join('\n'),ok=()=>{const m=$('#smsg');if(m)m.textContent='คัดลอกแล้ว'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{const m=$('#smsg');if(m)m.textContent='คัดลอกไม่สำเร็จ'});else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()}}}
function applyCfg(mode,n){S.mode=mode;S.n=n;ST={};save();render()}
function drawPlayers(){const names=S.roster.map(r=>r.n);if(!names.length){showM('<p class="q">ยังไม่มีรายชื่อนักเรียน กดตั้งค่าแล้ววางรายชื่อก่อน</p><div class="row"><button class="btn big" id="cl">ปิด</button></div>');$('#cl').onclick=()=>closeM();return}
  let pool=names.filter(x=>!(S.used||[]).includes(x));if(pool.length<S.n){S.used=[];pool=names.slice()}
  const pick=shuffle(pool).slice(0,Math.min(S.n,pool.length));S.used=(S.used||[]).concat(pick);
  for(let i=0;i<6;i++)S.solo[i]=pick[i]||('ผู้เล่น '+(i+1));
  sc().s=[0,0,0,0,0,0];ST={};save();render()}
function openSettings(){
  showM(`<h2 style="margin:0;font-family:var(--f-d)">ตั้งค่า ห้อง ${CUR}</h2>
  <div class="card2"><h3>รูปแบบการเล่น</h3><div class="row"><label class="f">โหมด<select id="smd"><option value="group" ${S.mode==='group'?'selected':''}>เล่นเป็นกลุ่ม</option><option value="solo" ${S.mode==='solo'?'selected':''}>เล่นเดี่ยว (ผู้เล่นแต่ละคน)</option></select></label><label class="f">จำนวน${S.mode==='solo'?'ผู้เล่น':'กลุ่ม'}<select id="snn">${[2,3,4,5,6].map(v=>`<option ${v===S.n?'selected':''}>${v}</option>`).join('')}</select></label></div><p class="hint">โหมดเดี่ยว: แต่ละรอบเลือกผู้เล่น 2–6 คน ใช้ปุ่ม "สุ่มผู้เล่นชุดใหม่" จากรายชื่อ คะแนนที่ได้จะสะสมเป็นคะแนนรายบุคคลของคนนั้นโดยอัตโนมัติ</p></div>
  <div class="card2"><h3>สุ่มเลขที่</h3><div class="row"><label class="f">จำนวนนักเรียน (1–50)<input type="number" id="snum" value="${S.nn||40}" min="1" max="50" style="width:110px"></label><label class="f">เลขที่ที่ขาด (ไม่สุ่ม)<input type="text" id="sab" value="${esc(S.absent||'')}" placeholder="เช่น 3, 12, 25" style="width:190px"></label></div><p class="hint">ถ้าไม่ได้วางรายชื่อนักเรียน ระบบจะสุ่มเป็น "เลขที่" ตามจำนวนนี้ ใช้กับเก้าอี้ร้อนทุกคาบ</p></div>
  <div class="two"><div class="card2"><h3>ชื่อ${S.mode==='solo'?'ผู้เล่น':'กลุ่ม'} (ใช้ ${S.n})</h3>${NM().map((n,i)=>`<label class="f" style="margin-bottom:6px">${S.mode==='solo'?'ผู้เล่น':'กลุ่ม'} ${i+1}<input type="text" id="tn${i}" value="${esc(n)}" maxlength="24"></label>`).join('')}</div>
  <div class="card2"><h3>รายชื่อนักเรียน</h3><p class="hint">วางทีละบรรทัด (ใส่เลขกลุ่มต่อท้ายหลังจุลภาคได้ เช่น สมชาย ใจดี,3) ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</p><textarea id="ros">${esc(S.roster.map(r=>r.n+(r.g?','+r.g:'')).join('\n'))}</textarea></div></div>
  <div class="row"><button class="btn gold big" id="sv">บันทึก</button><button class="btn big" id="cl">ปิด</button></div>`);
  $('#cl').onclick=()=>closeM();
  $('#sv').onclick=()=>{const md=$('#smd').value,n=+$('#snn').value;const key=S.mode==='solo'?'solo':'teams',lab=S.mode==='solo'?'ผู้เล่น ':'กลุ่ม ';
    S[key]=S[key].map((x,i)=>{const e=$('#tn'+i);return e?((e.value||'').trim()||(lab+(i+1))):x});
    S.roster=$('#ros').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)[,，]\s*(\d)\s*$/);return m?{n:m[1].trim(),g:+m[2]}:{n:l,g:0}});
    S.nn=Math.min(50,Math.max(1,+($('#snum').value)||40));S.absent=$('#sab').value;H.spun=[];
    S.mode=md;S.n=n;ST={};save();closeM();render()};
}
function wire(){
  const go=$('#go');if(go)go.onclick=fwd;
  const prv=$('#prv');if(prv)prv.onclick=back;
  document.querySelectorAll('.opt[data-o]').forEach(o=>o.onclick=()=>{o.style.borderColor='var(--gold)';o.style.background='#3a3f86';snd.pick()});
  if(ph===2)wireHot();
  if(ph===3)wireGames();
  if(ph===4){$('#win').onclick=()=>{snd.ok();confetti();const t=totals().sort((a,b)=>b.p-a.p)[0];$('#cmsg').textContent='ผู้ชนะวันนี้: '+t.n+' ('+t.p+' คะแนน)'};
    $('#copy').onclick=()=>{const t=totals(),ind=Object.entries(sc().i).sort((a,b)=>b[1]-a[1]);const txt=`ผลคะแนน ส33104 คาบ ${cp}\nกลุ่ม\tคะแนนคาบนี้\tสะสม\n`+t.map(x=>`${x.n}\t${x.p}\t${x.all}`).join('\n')+(ind.length?'\n\nรายบุคคล\n'+ind.map(([n,v])=>`${n}\t${v}`).join('\n'):'');
      const ok=()=>$('#cmsg').textContent='คัดลอกแล้ว วางใน Google Sheets หรือ Classroom ได้เลย';
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){const m=$('#cmsg');if(m)m.textContent='คัดลอกไม่สำเร็จ'}ta.remove()})};
    $('#rst').onclick=()=>{if(confirm('ล้างคะแนนของคาบนี้ทั้งหมด?')){delete S.sc[cp];save();render()}}}
}

function steps(){const p=P(),a=[[0,0,0]];p.slides.forEach((_,i)=>a.push([1,i,0]));a.push([2,0,0]);p.games.forEach((_,i)=>a.push([3,0,i]));a.push([4,0,0]);return a}
function idx(){const a=steps();const k=a.findIndex(x=>x[0]===ph&&(ph!==1||x[1]===sl)&&(ph!==3||x[2]===gi));return k<0?0:k}
function setStep(x){ph=x[0];sl=x[1];gi=x[2];render();window.scrollTo(0,0)}
function resetP(n){cp=n;ph=0;sl=0;gi=0;ST={};H={qi:0,who:null,spun:[],show:false,pass:false,pk:null,lines:[]}}
function fwd(){const a=steps(),k=idx();if(k<a.length-1)setStep(a[k+1]);else if(PERIODS[cp+1]){resetP(cp+1);render();window.scrollTo(0,0)}}
function back(){const a=steps(),k=idx();if(k>0)setStep(a[k-1]);else if(PERIODS[cp-1]){resetP(cp-1);const b=steps();setStep(b[b.length-1])}}
let ZM=1,FIT=true;try{ZM=+store.get('cls_zm')||1}catch(e){}
function applyZoom(){const w=$('#app');if(!w)return;const fit=FIT?Math.min(2.2,Math.max(1,innerWidth/1180)):1;w.style.zoom=fit*ZM;const b=$('#gbar');if(b)b.style.zoom=Math.min(1.6,Math.max(1,innerWidth/1500))}
function fs(){const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}}
function buildBar(){const b=document.createElement('div');b.id='gbar';b.innerHTML='<button id="gb" aria-label="ย้อนกลับ">◀ ย้อน</button><span id="gp"></span><button id="gf" aria-label="ถัดไป">ถัดไป ▶</button><i></i><button id="gm" aria-label="ตัวอักษรเล็กลง">A−</button><button id="gz" aria-label="ตัวอักษรใหญ่ขึ้น">A+</button><button id="gs" aria-label="เต็มจอ">⛶ เต็มจอ</button>';document.body.appendChild(b);
 $('#gb').onclick=back;$('#gf').onclick=fwd;$('#gs').onclick=fs;
 $('#gz').onclick=()=>{ZM=Math.min(2,+(ZM+.1).toFixed(2));store.set('cls_zm',ZM);applyZoom()};$('#gm').onclick=()=>{ZM=Math.max(.7,+(ZM-.1).toFixed(2));store.set('cls_zm',ZM);applyZoom()};
 document.addEventListener('keydown',e=>{const t=e.target&&e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(t)||e.ctrlKey||e.metaKey||e.altKey)return;if($('#modal')&&!$('#modal').hidden)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();fwd()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back()}else if(e.key==='f'||e.key==='F'){fs()}});
 addEventListener('resize',applyZoom)}
function updBar(){const a=steps(),k=idx(),p=$('#gp');if(p)p.textContent='คาบ '+cp+' • '+(k+1)+'/'+a.length;const f=$('#gf');if(f)f.disabled=(k===a.length-1&&!PERIODS[cp+1])}
function init(){load();buildBar();render()}

init();
</script>
</body></html>
